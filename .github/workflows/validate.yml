name: Repository checks

on:
  workflow_dispatch:
    inputs:
      deploy_main:
        description: Deploy validated main (explicit recovery only)
        type: boolean
        required: false
        default: false
  pull_request:
  push:
    branches:
      - main
      - validation/**

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

      - name: Validate workflows
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -color

  web-app:
    name: Fixture web build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app and pinned contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.15.0
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Read validated fixture tooling pin
        id: tooling
        run: node tools/prepare-demo.mjs --print-pin >> "$GITHUB_OUTPUT"
      - name: Checkout validated fixture publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.tooling.outputs.repository }}
          ref: ${{ steps.tooling.outputs.revision }}
          path: .fixture-publisher
          persist-credentials: false
          submodules: recursive
      - name: Install fixture publisher dependencies
        run: npm ci --prefix .fixture-publisher
      - name: Install browser and platform dependencies
        run: npx playwright install --with-deps chromium
      - name: Build and run all web suites
        env:
          DAASAVAANI_FIXTURE_PUBLISHER_ROOT: ${{ github.workspace }}/.fixture-publisher
        run: npm run check
      - name: Upload validated fixture-only website
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_main))
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    name: Deploy validated fixture demo
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_main))
    needs: [workflow-lint, web-app]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy validated output
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
